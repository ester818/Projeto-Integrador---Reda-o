<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Redação</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <nav class="navbar">
        <a href="ser-corretor.html">Como Funciona</a>
        <a href="index.html" class="active">Enviar sua redação</a>
        <button class="aluno-btn">Já sou aluno</button>
    </nav>

    <main class="container">
        <a href="index.html" class="voltar-btn">← Voltar à tela principal</a>

        <form action="Telaenvio.html" method="GET">
            <h1>Vamos começar!</h1>

            <input
                type="text"
                id="tema"
                name="tema"
                placeholder="Exemplo: Políticas para enfrentamento da evasão escolar"
            >

            <textarea
                name="redacao"
                placeholder="Escreva ou cole sua redação aqui..."
            ></textarea>

            <button class="enviar-btn" type="submit">
                Enviar redação
            </button>
        </form>
    </main>
</body>
</html>
